[package]
name = "cwbench"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
hmac = "0.12"
aes = "0.8"
num-bigint = "0.4"
num-integer = "0.1"
num-traits = "0.2"
k256 = { version = "0.13", features = ["ecdsa", "arithmetic"] }
hex = "0.4"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
bincode = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
